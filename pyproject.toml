[project]
name = "soa-extract"
version = "0.1.0"
description = "Locate and extract Schedule of Activities tables from clinical trial protocol PDFs"
requires-python = ">=3.10"
dependencies = [
    "pymupdf==1.24.14",
    "pydantic>=2.13",
    "google-genai>=2.21.0",
    "rapidfuzz==3.10.1",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.19",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
bench = [
    "pdfplumber==0.11.4",
    "camelot-py==0.11.0",
    "opencv-python-headless==4.10.0.84",
    "pandas==2.2.3",
]

[project.scripts]
soa = "soa.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["soa", "soa.locate", "soa.extract", "api"]
